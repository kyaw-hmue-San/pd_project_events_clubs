<text x="1162" y="256" class="body" fill="#475569">Planning · Organizer rubric</text>
<text x="1162" y="281" class="body" fill="#475569">Library relevance / search query</text>
<text x="1162" y="306" class="body" fill="#475569">Bounded task text; validated responses</text>
<rect x="1140" y="370" width="410" height="200" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
