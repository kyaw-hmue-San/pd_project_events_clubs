<text x="1162" y="435" class="title" fill="#0f172a">Team 10 Maintenance</text>
<text x="1162" y="466" class="body" fill="#475569">Reviewed creation POST → work order</text>
<text x="1162" y="491" class="body" fill="#475569">← signed status webhook</text>
<text x="1162" y="516" class="body" fill="#475569">HMAC · event deduplication · versions</text>
<text x="1162" y="541" class="body" fill="#475569">OPEN → ASSIGNED → … → CLOSED</text>
<rect x="1140" y="620" width="410" height="140" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
<text x="1162" y="649" class="overline" fill="#2563eb">PARTNER · READ ONLY</text>
<text x="1162" y="685" class="title" fill="#0f172a">Library</text>
<text x="1162" y="716" class="body" fill="#475569">Catalog GET → books and copy counts</text>
<text x="1162" y="741" class="body" fill="#475569">Search only; no identity or borrowing</text>
<rect x="1140" y="810" width="410" height="140" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
<text x="1162" y="839" class="overline" fill="#2563eb">PARTNER · READ ONLY</text>
<text x="1162" y="875" class="title" fill="#0f172a">Team 17 Internship</text>
<text x="1162" y="906" class="body" fill="#475569">Public feed GET → labelled listings</text>
<text x="1162" y="931" class="body" fill="#475569">No identity forwarding or applications</text>
<rect x="1140" y="980" width="410" height="88" rx="18" fill="#fffbeb" stroke="#fbbf24" stroke-dasharray="6 5"/>
<text x="1162" y="1009" class="overline" fill="#2563eb">COORDINATION ATTEMPTED</text>
<text x="1162" y="1045" class="title" fill="#0f172a">Notification Hub</text>
<rect x="50" y="955" width="1000" height="113" rx="18" fill="#e2e8f0"/>
<text x="72" y="985" class="overline" fill="#334155">PRIVACY + SECURITY</text>
<text x="72" y="1016" class="body" fill="#334155">No direct browser Firestore access · least privilege · explicit facilities sharing</text>
<text x="72" y="1043" class="body" fill="#334155">Public privacy notice · manual data requests · reviewed retention policy</text>
<text x="50" y="1110" class="small" fill="#64748b">Connections completed per user confirmation. Diagram is not a new captured live test; Notification Hub has no active data path.</text>
<text x="50" y="1135" class="small" fill="#64748b">Cloud evaluation: Firebase Hosting + Render + permanent partner endpoints. No localhost or ngrok dependency.</text>
