<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title description">
<title id="title">Campus Events and Clubs implemented cloud architecture</title>
<desc id="description">Firebase Hosting serves a React browser app for Students, Organizers and Admins. Google sign-in uses Firebase Authentication. The browser calls a persistent Express API on Render, which verifies identity, authorizes access and transacts against Firestore. Server-only connections use AI/ML API, Maintenance, Library and Team 17 Internship. Maintenance status returns through signed webhooks. Notification Hub was attempted and has no active flow.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.overline{font-size:13px;font-weight:700;letter-spacing:2px}.title{font-size:24px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.label{font-size:13px;fill:#475569} .wire{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
