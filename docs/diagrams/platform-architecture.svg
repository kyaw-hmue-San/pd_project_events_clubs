<rect x="50" y="150" width="480" height="154" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
<text x="72" y="179" class="overline" fill="#2563eb">DELIVERY + CLIENT</text>
<text x="72" y="215" class="title" fill="#0f172a">Firebase Hosting / Browser</text>
<text x="72" y="246" class="body" fill="#475569">React · TypeScript · Vite</text>
<text x="72" y="271" class="body" fill="#475569">Student / Organizer / Admin; local QR decode</text>
<rect x="620" y="150" width="430" height="154" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
<text x="642" y="179" class="overline" fill="#2563eb">IDENTITY</text>
<text x="642" y="215" class="title" fill="#0f172a">Firebase Authentication</text>
<text x="642" y="246" class="body" fill="#475569">Google sign-in and Firebase ID tokens</text>
<text x="642" y="271" class="body" fill="#475569">Role/capability authority stays in the API</text>
<rect x="50" y="402" width="1000" height="210" rx="18" fill="#172554" stroke="#2563eb"/>
<text x="72" y="431" class="overline" fill="#bfdbfe">TRUSTED APPLICATION BOUNDARY</text>
<text x="72" y="467" class="title" fill="#ffffff">Render · persistent Node.js / Express API</text>
<text x="72" y="498" class="body" fill="#dbeafe">Identity verification → role / ownership checks → input validation</text>
<text x="72" y="523" class="body" fill="#dbeafe">Activities · registrations · attendance · profiles · Organizer admission</text>
<text x="72" y="548" class="body" fill="#dbeafe">AI review / planning · owner-reviewed facilities · read-only resource proxies</text>
<text x="72" y="573" class="body" fill="#dbeafe">Server-only Admin credentials, AI key, partner keys and webhook secrets</text>
<rect x="50" y="700" width="600" height="200" rx="18" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="72" y="729" class="overline" fill="#2563eb">APPLICATION DATA</text>
<text x="72" y="765" class="title" fill="#0f172a">Cloud Firestore</text>
<text x="72" y="796" class="body" fill="#475569">Profiles / enrollment · activities / registrations</text>
<text x="72" y="821" class="body" fill="#475569">Attendance / private ticket lookup · decisions</text>
<text x="72" y="846" class="body" fill="#475569">Facilities links / snapshots · inbox / outbox / audit</text>
<text x="72" y="871" class="body" fill="#475569">Atomic locks, counts, claims, leases and revisions</text>
<rect x="700" y="700" width="350" height="200" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
<text x="722" y="729" class="overline" fill="#2563eb">PERSISTENT RUNTIME</text>
<text x="722" y="765" class="title" fill="#0f172a">Integration worker</text>
<text x="722" y="796" class="body" fill="#475569">Legacy durable retries / leases</text>
<text x="722" y="821" class="body" fill="#475569">Publication / polling disabled</text>
<text x="722" y="846" class="body" fill="#475569">Facilities Send stays explicit</text>
<text x="722" y="871" class="body" fill="#475569">Render idle sleep pauses worker</text>
<rect x="1140" y="160" width="410" height="160" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/>
