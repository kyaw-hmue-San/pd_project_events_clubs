$kind: http-request
url: https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key={{firebaseApiKey}}
method: POST
headers:
  Content-Type: application/json
queryParams:
  key: "{{firebaseApiKey}}"
body:
  type: text
  content: |-
    {
      "email": "{{studentEmail}}",
      "password": "{{studentPassword}}",
      "returnSecureToken": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Student signed in', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      if (body.idToken) pm.collectionVariables.set('studentToken', body.idToken);
    language: text/javascript
order: 3000
