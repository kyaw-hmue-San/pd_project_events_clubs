$kind: http-request
url: "{{baseUrl}}/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "equipmentId": "eq-missing",
      "borrowerName": "Suda Dee",
      "startAt": "2026-10-22T09:00:00.000Z",
      "endAt": "2026-10-22T10:00:00.000Z",
      "purpose": "Equipment validation test"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 404', () => pm.response.to.have.status(404));
      pm.test('Equipment error is returned', () => pm.expect(pm.response.json().error).to.eql('Equipment not found'));
    language: text/javascript
order: 8000
