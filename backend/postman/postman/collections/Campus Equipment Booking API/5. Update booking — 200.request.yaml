$kind: http-request
url: "{{baseUrl}}/bookings/{{bookingId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "equipmentId": "eq-1",
      "borrowerName": "Somchai Jaidee",
      "startAt": "2026-10-20T12:00:00.000Z",
      "endAt": "2026-10-20T14:00:00.000Z",
      "purpose": "Updated class presentation"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Fields were updated', () => {
        const data = pm.response.json();
        pm.expect(data.startAt).to.eql('2026-10-20T12:00:00.000Z');
        pm.expect(data.purpose).to.eql('Updated class presentation');
      });
    language: text/javascript
order: 5000
