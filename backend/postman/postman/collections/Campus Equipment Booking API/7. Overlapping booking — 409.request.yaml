$kind: http-request
url: "{{baseUrl}}/bookings"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "equipmentId": "eq-1",
      "borrowerName": "Suda Dee",
      "startAt": "2026-10-20T12:30:00.000Z",
      "endAt": "2026-10-20T13:30:00.000Z",
      "purpose": "Conflict test"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 409', () => pm.response.to.have.status(409));
      pm.test('Conflict JSON error is returned', () => pm.expect(pm.response.json().error).to.include('conflict'));
    language: text/javascript
order: 7000
