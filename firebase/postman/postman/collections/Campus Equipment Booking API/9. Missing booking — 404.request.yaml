$kind: http-request
url: "{{baseUrl}}/bookings/not-found"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 404', () => pm.response.to.have.status(404));
      pm.test('Booking error is returned', () => pm.expect(pm.response.json().error).to.eql('Booking not found'));
    language: text/javascript
order: 9000
